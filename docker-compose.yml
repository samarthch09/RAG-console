version: "3.9"
services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

  inngest:
    image: inngest/inngest:latest
    command: ["inngest", "dev", "-u", "http://api:8000/api/inngest"]
    ports:
      - "8288:8288"
    depends_on:
      - api

  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - QDRANT_URL=http://qdrant:6333
    depends_on:
      - qdrant
    volumes:
      - ./uploads:/app/uploads

volumes:
  qdrant_storage:
